<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortnite : Compte à Rebours d'Événement</title>
    
    <!-- Framework Tailwind CSS & Polices Google -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Inter:wght@400;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================================================
           1. STYLES DE BASE & TYPOGRAPHIE
           ========================================================================== */
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at center, #2e1065 0%, #0f0518 60%, #000000 100%);
            overflow-x: hidden;
            color: #ffffff;
            min-height: 100vh;
            margin: 0;
        }

        h1, h2, h3, .digit, .event-font {
            font-family: 'Russo One', sans-serif;
        }

        /* ==========================================================================
           2. EFFET VISUEL GLITCH / FISSURE (TITRE)
           ========================================================================== */
        .crack-effect {
            position: relative;
            display: inline-block;
            color: white;
        }

        /* Clone supérieur et inférieur pour l'effet de décalage */
        .crack-effect::before, 
        .crack-effect::after {
            content: attr(data-text);
            position: absolute;
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: #0f0518;
            color: #fff;
            overflow: hidden;
            pointer-events: none;
            opacity: 0;
        }

        .crack-effect::before {
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.8);
            z-index: 2;
            animation: crack-top 4s infinite ease-in-out; 
            clip-path: polygon(0 0, 100% 0, 100% 35%, 70% 60%, 30% 40%, 0 70%);
        }

        .crack-effect::after {
            text-shadow: 0 0 5px rgba(217, 70, 239, 0.8);
            z-index: 2;
            animation: crack-bottom 4s infinite ease-in-out;
            clip-path: polygon(0 71%, 30% 41%, 70% 61%, 100% 36%, 100% 100%, 0 100%);
        }

        .crack-effect span {
            display: inline-block;
            animation: shake-base 4s infinite;
        }

        @keyframes crack-top {
            0%, 40%, 100% { transform: translate(0, 0); opacity: 0; }
            41% { opacity: 1; }
            42% { transform: translate(-3px, -3px) rotate(-1deg); opacity: 1; }
            45% { transform: translate(0, 0); opacity: 1; }
            46% { opacity: 0; }
            70% { opacity: 0; }
            71% { opacity: 1; transform: translate(2px, -4px); }
            73% { transform: translate(0, 0); opacity: 0; }
        }

        @keyframes crack-bottom {
            0%, 40%, 100% { transform: translate(0, 0); opacity: 0; }
            41% { opacity: 1; }
            42% { transform: translate(3px, 3px) rotate(1deg); opacity: 1; }
            45% { transform: translate(0, 0); opacity: 1; }
            46% { opacity: 0; }
            70% { opacity: 0; }
            71% { opacity: 1; transform: translate(-2px, 4px); }
            73% { transform: translate(0, 0); opacity: 0; }
        }

        @keyframes shake-base {
            0%, 40%, 100% { filter: blur(0); transform: scale(1); color: white; }
            41% { color: #e879f9; } 
            42% { filter: blur(2px); transform: scale(1.02); }
            43% { filter: blur(0); transform: scale(1); color: white; }
        }

        /* ==========================================================================
           3. EFFETS DE PULSATION & GLASSMORPHISME (INTERFACE)
           ========================================================================== */
        .title-pulse {
            background: linear-gradient(180deg, #ffffff 0%, #d946ef 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(189, 0, 255, 0.5));
            animation: deep-pulse 3s infinite alternate;
        }

        @keyframes deep-pulse {
            0% { filter: drop-shadow(0 0 10px rgba(189, 0, 255, 0.3)); }
            100% { filter: drop-shadow(0 0 25px rgba(189, 0, 255, 0.9)); }
        }

        .glass-panel {
            background: rgba(20, 10, 40, 0.55);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .description-box {
            border-left: 4px solid #d946ef;
            background: linear-gradient(90deg, rgba(217, 70, 239, 0.12) 0%, transparent 100%);
        }

        /* ==========================================================================
           4. CARTE VIDÉO (LECTEUR TRAILER)
           ========================================================================== */
        .video-card {
            position: relative;
            padding-bottom: 56.25%; /* Ratio 16:9 standard */
            height: 0;
            overflow: hidden;
            border-radius: 0.5rem;
            background-color: #000000;
            cursor: pointer;
        }

        .video-card img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.82;
            transition: opacity 0.3s ease, transform 0.5s ease;
        }

        .video-card:hover img {
            opacity: 0.6;
            transform: scale(1.04);
        }

        .play-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 64px;
            height: 64px;
            background: rgba(217, 70, 239, 0.85);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease, background 0.3s ease;
            box-shadow: 0 0 22px rgba(217, 70, 239, 0.6);
        }

        .video-card:hover .play-button {
            transform: translate(-50%, -50%) scale(1.15);
            background: rgba(217, 70, 239, 1);
        }
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            /* --- 1. COUNTDOWN LOGIC --- */
            const daysEl = document.getElementById('days');
            const hoursEl = document.getElementById('hours');
            const minutesEl = document.getElementById('minutes');
            const secondsEl = document.getElementById('seconds');
            const localTimeDisplay = document.getElementById('local-time-display');

            const targetDate = new Date("2025-11-29T20:00:00+01:00").getTime();

            function updateCountdown() {
                const now = new Date().getTime();
                const distance = targetDate - now;

                if (localTimeDisplay) {
                    localTimeDisplay.textContent = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                }

                if (distance < 0) {
                    document.querySelector('h1').innerHTML = "<span class='text-fuchsia-500'>LIVE EN COURS</span>";
                    if(daysEl) daysEl.innerText = "00";
                    if(hoursEl) hoursEl.innerText = "00";
                    if(minutesEl) minutesEl.innerText = "00";
                    if(secondsEl) secondsEl.innerText = "00";
                    return;
                }

                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                if(daysEl) daysEl.innerText = days < 10 ? "0" + days : days;
                if(hoursEl) hoursEl.innerText = hours < 10 ? "0" + hours : hours;
                if(minutesEl) minutesEl.innerText = minutes < 10 ? "0" + minutes : minutes;
                if(secondsEl) secondsEl.innerText = seconds < 10 ? "0" + seconds : seconds;
            }

            updateCountdown();
            setInterval(updateCountdown, 1000);

            /* --- 2. CANVAS VISUAL ENGINE --- */
            const canvas = document.getElementById('fogCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            
            let w, h;
            let clouds = [];
            let lightnings = [];

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
                initClouds();
            }
            window.addEventListener('resize', resize);

            class Cloud {
                constructor() {
                    this.reset();
                    this.y = Math.random() * h; 
                }

                reset() {
                    this.x = Math.random() * w;
                    this.y = Math.random() * h;
                    this.radius = 150 + Math.random() * 300; 
                    this.speedX = (Math.random() - 0.5) * 0.4;
                    this.speedY = (Math.random() - 0.5) * 0.2;
                    
                    const colors = [
                        '147, 51, 234', '192, 38, 211', '126, 34, 206', '76, 29, 149'
                    ];
                    this.color = colors[Math.floor(Math.random() * colors.length)];
                    this.alpha = 0.05 + Math.random() * 0.10; 
                }

                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    if (this.x < -this.radius) this.x = w + this.radius;
                    if (this.x > w + this.radius) this.x = -this.radius;
                    if (this.y < -this.radius) this.y = h + this.radius;
                    if (this.y > h + this.radius) this.y = -this.radius;
                }

                draw() {
                    const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
                    g.addColorStop(0, `rgba(${this.color}, ${this.alpha})`);
                    g.addColorStop(1, `rgba(${this.color}, 0)`);
                    ctx.fillStyle = g;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
                    ctx.fill();
                }
            }

            class Lightning {
                constructor() {
                    this.life = 15 + Math.random() * 10;
                    this.x = Math.random() * w;
                    this.y = Math.random() * (h * 0.4);
                    this.bolts = [];
                    this.generatePath(this.x, this.y);
                }

                generatePath(x, y) {
                    let currX = x;
                    let currY = y;
                    for(let i=0; i<10; i++) {
                        let nextX = currX + (Math.random() - 0.5) * 100;
                        let nextY = currY + 30 + Math.random() * 60;
                        this.bolts.push({x: currX, y: currY, tx: nextX, ty: nextY});
                        currX = nextX;
                        currY = nextY;
                    }
                }

                update() { this.life--; }

                draw() {
                    if (this.life <= 0) return;
                    const opacity = this.life / 20;
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = "#e879f9"; 
                    ctx.strokeStyle = `rgba(255, 255, 255, ${opacity})`;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    this.bolts.forEach(b => {
                        ctx.moveTo(b.x, b.y);
                        ctx.lineTo(b.tx, b.ty);
                    });
                    ctx.stroke();
                    if (this.life > 15) {
                        ctx.fillStyle = `rgba(232, 121, 249, ${0.05 * Math.random()})`;
                        ctx.fillRect(0,0,w,h);
                    }
                    ctx.shadowBlur = 0;
                }
            }

            function initClouds() {
                clouds = [];
                const count = Math.min(50, Math.floor(w / 20)); 
                for(let i=0; i<count; i++) {
                    clouds.push(new Cloud());
                }
            }

            resize();

            function animate() {
                ctx.clearRect(0, 0, w, h);
                ctx.globalCompositeOperation = 'screen';
                for(let i=0; i<clouds.length; i++) {
                    clouds[i].update();
                    clouds[i].draw();
                }
                ctx.globalCompositeOperation = 'source-over';
                if (Math.random() < 0.03) lightnings.push(new Lightning());
                for(let i=lightnings.length-1; i>=0; i--) {
                    lightnings[i].update();
                    lightnings[i].draw();
                    if(lightnings[i].life <= 0) lightnings.splice(i, 1);
                }
                requestAnimationFrame(animate);
            }
            animate();
        });
    </script>
</body>
</html>
